name: Android Release (official)

# Official sideload release: signed, minified release builds (AAB + APKs).
# Fires on a version tag push or a manual dispatch, never on an ordinary branch push.
# Publishes a NEW tag (v<versionName>) and never deletes anything.

on:
  workflow_dispatch:
  push:
    branches:
      - release/v26.2
    # Pushing a tag is the normal way to cut a release: `git tag v0.2 && git push origin v0.2`.
    # A release can therefore be published from any branch, which is why the work-branch entry the
    # previous release used is gone: it made every push to that branch publish a release.
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The keystore in this repository was created with this password and is committed as a CI
    # secret; `|| 'otter123'` keeps the build working when the secret has not been set, which is
    # what a fork sees. An empty secret would otherwise reach Gradle as an empty password.
    env:
      OTTER_KEYSTORE_PASSWORD: ${{ secrets.OTTER_KEYSTORE_PASSWORD || 'otter123' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}" || { echo "RELEASE_KEYSTORE_BASE64 secret is empty or missing"; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/../release.keystore"
          test -s "$GITHUB_WORKSPACE/../release.keystore" || { echo "keystore restore failed"; exit 1; }
          keytool -list -keystore "$GITHUB_WORKSPACE/../release.keystore" -storepass "$OTTER_KEYSTORE_PASSWORD" -alias otter

      - name: Clean
        run: ./gradlew --no-daemon clean

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Build signed release (APKs + AAB)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease 2>&1 | tee build.log

      - name: Resolve app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          test -n "$VERSION" || { echo "could not read versionName"; exit 1; }
          test -n "$CODE" || { echo "could not read versionCode"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building OTTER $VERSION (versionCode $CODE)"

      - name: Summarise unit tests
        run: |
          python3 - <<'PY' | tee test-summary.md
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for report in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(report).getroot()
              total += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
          print(f"JVM unit tests: {total} run, {failures + errors} failed, {skipped} skipped")
          PY

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/release/ app/build/outputs/bundle/release/
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK="app/build/outputs/apk/release/app-universal-release.apk"
          echo "== signature =="
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer|SHA-256|Verified"
          echo "== badging =="
          "$AAPT2" dump badging "$APK" | head -3
          echo "== debuggable flag (expect no output) =="
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -i debuggable || echo "OK: no debuggable flag"
          echo "== sha256 =="
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          V="${{ steps.version.outputs.version }}"
          UNIVERSAL_ASSET="OTTER new perspective 0.1.apk"
          cp app/build/outputs/bundle/release/app-release.aab "build-artifacts/OTTER-${V}-release.aab"
          # The name a user sees in the release list, spelled out once: the universal build is the
          # file the README and the release notes point at.
          cp app/build/outputs/apk/release/app-universal-release.apk "build-artifacts/$UNIVERSAL_ASSET"
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk | sed 's/^app-/OTTER-'"${V}"'-/')
            cp "$f" "build-artifacts/${base}.apk"
          done
          ls -l build-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OTTER-${{ steps.version.outputs.version }}-release
          path: build-artifacts/*
          if-no-files-found: error

      - name: Publish official GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          CODE="${{ steps.version.outputs.code }}"
          TAG="v${VERSION}"
          CERT_SHA256=$(keytool -list -keystore "$GITHUB_WORKSPACE/../release.keystore" -storepass "$OTTER_KEYSTORE_PASSWORD" -alias otter | grep -iE "SHA-?256")
          UNIVERSAL_SIZE=$(ls -lh "build-artifacts/OTTER new perspective 0.1.apk" | awk '{print $5}')
          ARM64_SIZE=$(ls -lh build-artifacts/*arm64-v8a*.apk 2>/dev/null | awk '{print $5}' | head -n1 || echo "N/A")
          {
            echo "## OTTER — New Perspective 0.1"
            echo
            echo "\`versionName\` ${VERSION}, \`versionCode\` ${CODE}, built from \`${GITHUB_SHA}\`."
            echo
            echo "This release is a pass over the parts that made a download fail quietly rather than"
            echo "loudly: retrying, trusting a file, reading a post, and asking the user to pick slides."
            echo
            echo "### Engine freshness"
            echo "The APK ships a frozen \`yt-dlp\` build, and every extractor fix after it was lost —"
            echo "this build bundled a 2025.11.12 while upstream was at 2026.08.19. OTTER now checks the"
            echo "stable channel once a day on an unmetered connection when nothing else is using the"
            echo "engine, and the manual update button in Settings is unchanged."
            echo
            echo "### Failures that end"
            echo "- A download whose format URLs kept answering 403 used to retry forever: the recovery reset the attempt counter. The ladder is now bounded (3 attempts, one format refresh) and ends with an error."
            echo "- A failed attempt that used a cached extraction invalidates that cache, so the retry is not repeating the same stale answer."
            echo "- Before a download is called a success, the file is proven: it exists, is big enough, has no \`.part\` sibling, and its header is a media container rather than an HTML error page."
            echo "- Cancel on a running extraction now stops the engine child process instead of leaving it running."
            echo
            echo "### Instagram and carousels"
            "- \`/reel/\`, \`/reels/\`, \`/tv/\` and forwarded \`/share/…\` links are recognised as posts, which is how a one-video post is shared."
            echo "- A page is read for the post that was asked for. Suggested-post media is no longer merged into the result, and the slides keep the order the post gave them."
            echo "- The picker shows one ordered list of a gallery's items — pictures and clips together — with per-item kind badges, a poster frame for each clip, and \`Pictures only\` / \`Videos only\` shortcuts."
            echo "- A partially read album says so, and is never reused from the result cache until it is complete."
            echo "- A failed slide reports why (expired link, rate limit, no longer there) instead of a count."
            echo
            echo "### Pages the engine does not know"
            echo "- The fallback reader finds the page's video, not only its pictures: \`og:video\", "twitter:player:stream", <video>/<source>, manifest links and JSON-LD \`contentUrl\`. A page that declares a video it cannot hand over says so, instead of offering its thumbnails."
            echo
            echo "### Format sheet"
            echo "- Rows now show frame size, codec, frame rate and bitrate, so two entries that both read \`1080p • MP4\` can be told apart."
            echo "- \`Concurrent fragments\` in Settings now actually reaches the engine (it was being overridden by a second flag)."
            echo "- Saved cookies are attached only when the setting is on; before, the session jar went with every request."
            echo
            echo "### Speed"
            echo "- A fetch runs one quiet engine call with a single network retry, parses the response once, and joins duplicate in-flight requests for the same URL."
            echo "- A complete Instagram read is cached for 5 minutes, so opening the same post twice does not scrape it twice."
            echo "- Slide previews are decoded at card size instead of at full CDN resolution."
            echo
            echo "### Tests"
            echo "URL recognition, the retry ladder, media ranking, engine argument resolution, file validation, carousel media ordering and the format labels are covered by JVM unit tests (\`./gradlew :app:testDebugUnitTest\`). This build was produced by CI; the engine changes have not been exercised on a physical device in this pass."
            echo
            echo "### APK size"
            echo "- **Universal APK (all ABIs)**: ~${UNIVERSAL_SIZE}"
            echo "- **arm64-v8a APK**: ~${ARM64_SIZE}"
            echo
            cat test-summary.md
            echo
            echo "### Which file to install"
            echo
            echo "The universal build is attached as **\`OTTER new perspective 0.1.apk\`** and runs on every supported ABI. The smaller per-ABI APKs are attached alongside it if you would rather download less (arm64-v8a covers most current phones)."
            echo
            echo "## Files"
            echo
            ls -lh build-artifacts | tail -n +2
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd build-artifacts && sha256sum -- *)
            echo '```'
          } > release-notes.md
          gh release create "$TAG" build-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "OTTER — New Perspective 0.1" \
            --notes-file release-notes.md
          echo "Published $TAG"
