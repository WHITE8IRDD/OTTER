name: Android Release (official)

# Build a signed candidate by default. Building is NOT permission to publish an untested APK.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only after every Outter 28 verification scenario has passed'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OTTER_KEYSTORE_PASSWORD: ${{ secrets.OTTER_KEYSTORE_PASSWORD || 'otter123' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore existing official signing key
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}" || { echo "RELEASE_KEYSTORE_BASE64 is missing; refusing to generate a different signing key"; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/../release.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/../release.keystore" -storepass "$OTTER_KEYSTORE_PASSWORD" -alias otter
      - name: Test and build signed release candidate
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease 2>&1 | tee release-build.log
      - name: Report build failures
        if: failure()
        run: |
          grep -E '^e: |FAILED|Caused by:|error:|Execution failed|checksum|solver' release-build.log | tail -n 40 |
            while IFS= read -r line; do printf '::error::%s\n' "${line//%/%25}"; done
      - name: Verify signature, version and non-debuggable APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-universal-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > apk-badging.txt
          grep "versionCode='22' versionName='28'" apk-badging.txt
          if grep -q application-debuggable apk-badging.txt; then echo 'Release APK is debuggable'; exit 1; fi
      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/app-universal-release.apk "build-artifacts/Outter 28.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "build-artifacts/OTTER-28-${abi}-release.apk"
          done
          cp app/build/outputs/bundle/release/app-release.aab build-artifacts/OTTER-28-release.aab
          (cd build-artifacts && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: Outter-28-signed-candidate
          path: build-artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Outter-28-build-reports
          path: |
            release-build.log
            apk-badging.txt
            app/build/reports/tests

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: Outter-28-signed-candidate
          path: build-artifacts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch signed candidate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install "build-artifacts/Outter 28.apk"
            adb shell dumpsys package com.otter.app | grep 'versionName=28'
            adb shell am start -W -n com.otter.app/.MainActivity
            adb shell pidof com.otter.app

  publish:
    needs: [build, install]
    # Tag pushes cannot silently publish a build with unverified downloading behaviour.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: write
      checks: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: Outter-28-signed-candidate
          path: build-artifacts
      - name: Require real-media verification evidence for this exact APK and source
        run: python3 .github/scripts/verify_release_evidence.py --apk "build-artifacts/Outter 28.apk"
      - name: Require successful Android unit and device validation on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-validation.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          test "$COUNT" -gt 0 || { echo 'Android validation including device tests has not passed'; exit 1; }
      - name: Publish official Outter 28
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp docs/releases/Outter-28-notes.md release-notes.md
          cat docs/releases/Outter-28-verification.md >> release-notes.md
          gh release create v28 build-artifacts/* --target "$GITHUB_SHA" --title "Outter 28" --notes-file release-notes.md
