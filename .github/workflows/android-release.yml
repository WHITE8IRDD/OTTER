name: Android Release (official)

# Official sideload release: signed, minified release builds (AAB + APKs).
# Fires on a version tag push or a manual dispatch, never on an ordinary branch push.
# Publishes a NEW tag (v<versionName>) and never deletes anything.

on:
  workflow_dispatch:
  push:
    branches:
      - release/v26.2
    # Pushing a tag is the normal way to cut a release: `git tag v0.2 && git push origin v0.2`.
    # A release can therefore be published from any branch, which is why the work-branch entry the
    # previous release used is gone: it made every push to that branch publish a release.
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The keystore in this repository was created with this password and is committed as a CI
    # secret; `|| 'otter123'` keeps the build working when the secret has not been set, which is
    # what a fork sees. An empty secret would otherwise reach Gradle as an empty password.
    env:
      OTTER_KEYSTORE_PASSWORD: ${{ secrets.OTTER_KEYSTORE_PASSWORD || 'otter123' }}
      # The official release name: the GitHub release title and the one APK file that
      # ordinary users are told to download. Spelled out once, used everywhere below.
      RELEASE_NAME: "Outer 27"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}" || { echo "RELEASE_KEYSTORE_BASE64 secret is empty or missing"; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/../release.keystore"
          test -s "$GITHUB_WORKSPACE/../release.keystore" || { echo "keystore restore failed"; exit 1; }
          keytool -list -keystore "$GITHUB_WORKSPACE/../release.keystore" -storepass "$OTTER_KEYSTORE_PASSWORD" -alias otter

      - name: Clean
        run: ./gradlew --no-daemon clean

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Build signed release (APKs + AAB)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease 2>&1 | tee build.log

      - name: Resolve app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          test -n "$VERSION" || { echo "could not read versionName"; exit 1; }
          test -n "$CODE" || { echo "could not read versionCode"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building OTTER $VERSION (versionCode $CODE)"

      - name: Summarise unit tests
        run: |
          python3 - <<'PY' | tee test-summary.md
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for report in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(report).getroot()
              total += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
          print(f"JVM unit tests: {total} run, {failures + errors} failed, {skipped} skipped")
          PY

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/release/ app/build/outputs/bundle/release/
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK="app/build/outputs/apk/release/app-universal-release.apk"
          echo "== signature =="
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer|SHA-256|Verified"
          echo "== badging =="
          "$AAPT2" dump badging "$APK" | head -3
          echo "== debuggable flag (expect no output) =="
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -i debuggable || echo "OK: no debuggable flag"
          echo "== sha256 =="
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          V="${{ steps.version.outputs.version }}"
          # The file ordinary users download, named exactly as the release is named.
          UNIVERSAL_ASSET="${RELEASE_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "build-artifacts/OTTER-${V}-release.aab"
          # The name a user sees in the release list, spelled out once: the universal build is the
          # file the README and the release notes point at.
          cp app/build/outputs/apk/release/app-universal-release.apk "build-artifacts/$UNIVERSAL_ASSET"
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk | sed 's/^app-/OTTER-'"${V}"'-/')
            cp "$f" "build-artifacts/${base}.apk"
          done
          ls -l build-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OTTER-${{ steps.version.outputs.version }}-release
          path: build-artifacts/*
          if-no-files-found: error

      - name: Publish official GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          CODE="${{ steps.version.outputs.code }}"
          TAG="v${VERSION}"
          CERT_SHA256=$(keytool -list -keystore "$GITHUB_WORKSPACE/../release.keystore" -storepass "$OTTER_KEYSTORE_PASSWORD" -alias otter | grep -iE "SHA-?256")
          UNIVERSAL_SIZE=$(ls -lh "build-artifacts/${RELEASE_NAME}.apk" | awk '{print $5}')
          ARM64_SIZE=$(ls -lh build-artifacts/*arm64-v8a*.apk 2>/dev/null | awk '{print $5}' | head -n1 || echo "N/A")
          {
            echo "## ${RELEASE_NAME}"
            echo
            echo "\`versionName\` ${VERSION}, \`versionCode\` ${CODE}, built from \`${GITHUB_SHA}\`."
            echo
            echo "This release restores the Quick Download window and applies one media-selection"
            echo "logic to every supported platform."
            echo
            echo "### Quick Download opens over the sharing app again"
            echo "- Sharing a link to **Quick Download** now opens a small selection window *over* Instagram/TikTok/YouTube. It no longer drags you into OTTER's main screen."
            echo "- The window lists every file of the post — pictures and clips together, each labelled, clips previewed by their poster frame — with select-all / clear / pictures-only / videos-only shortcuts and one Download button."
            echo "- Picked files are fetched by the foreground download service, so the download keeps running while you stay in the app that shared the link."
            echo
            echo "### Instagram media detection"
            echo "- Single-image, single-video, image-only carousel, video-only carousel and mixed carousel posts are each detected and listed completely (unit-tested shape by shape)."
            echo "- A post that declares more slides than could be read says so instead of looking complete, and a one-slide partial read is now reported too."
            echo
            echo "### TikTok"
            echo "- Photo-mode posts (including forwarded links that drop the \`@user\` segment) open the same selection window with their images."
            echo "- TikTok videos use the engine download path; when the page parser comes up empty the engine's own photo-post entries are recognised as gallery slides."
            echo
            echo "### YouTube and other sites"
            echo "- Long-form videos and Shorts keep the fresh-engine + SABR-workaround extraction; merged video+audio now lands in MP4 (remuxed, never re-encoded) so Android players open it directly."
            echo "- Sites with a yt-dlp extractor (Vimeo, Dailymotion, …) download through it with per-site headers; pages no extractor knows are read for their declared video/images, and an unreadable page reports why instead of failing silently."
            echo
            echo "### Tests"
            echo "JVM unit tests cover URL routing for the quick window, batch-spec building, the Instagram format matrix (each post shape tested separately), TikTok photo URL recognition, carousel ordering, retry policy and file validation."
            echo
            echo "### Honest testing status"
            echo "This build was produced and unit-tested by CI. The engine and extraction changes have **not** been exercised on a physical device in this pass — device verification of the Quick Download window on Instagram is the first thing to check after installing."
            echo
            echo "### APK size"
            echo "- **Universal APK (all ABIs)**: ~${UNIVERSAL_SIZE}"
            echo "- **arm64-v8a APK**: ~${ARM64_SIZE}"
            echo
            cat test-summary.md
            echo
            echo "### Which file to install"
            echo
            echo "The universal build is attached as **\`${RELEASE_NAME}.apk\`** (GitHub writes asset names with dots) and runs on every supported ABI. The smaller per-ABI APKs are attached alongside it if you would rather download less (arm64-v8a covers most current phones)."
            echo
            echo "## Files"
            echo
            ls -lh build-artifacts | tail -n +2
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd build-artifacts && sha256sum -- *)
            echo '```'
          } > release-notes.md
          gh release create "$TAG" build-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md
          echo "Published $TAG as $RELEASE_NAME"
