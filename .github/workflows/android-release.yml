name: Android Release (official)

# Official sideload release: signed, minified release builds (AAB + APKs).
# Runs on workflow_dispatch ONLY — no push trigger, so it never fires by accident.
# Publishes a NEW tag (v<versionName>) and never deletes anything.

on:
  workflow_dispatch:
  push:
    branches:
      - release/v26.2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}" || { echo "RELEASE_KEYSTORE_BASE64 secret is empty or missing"; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/../release.keystore"
          test -s "$GITHUB_WORKSPACE/../release.keystore" || { echo "keystore restore failed"; exit 1; }
          keytool -list -keystore "$GITHUB_WORKSPACE/../release.keystore" -storepass otter123 -alias otter

      - name: Clean
        run: ./gradlew --no-daemon clean

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Build signed release (APKs + AAB)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease 2>&1 | tee build.log

      - name: Resolve app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          test -n "$VERSION" || { echo "could not read versionName"; exit 1; }
          test -n "$CODE" || { echo "could not read versionCode"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building OTTER $VERSION (versionCode $CODE)"

      - name: Summarise unit tests
        run: |
          python3 - <<'PY' | tee test-summary.md
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for report in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(report).getroot()
              total += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
          print(f"JVM unit tests: {total} run, {failures + errors} failed, {skipped} skipped")
          PY

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/release/ app/build/outputs/bundle/release/
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK="app/build/outputs/apk/release/app-universal-release.apk"
          echo "== signature =="
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer|SHA-256|Verified"
          echo "== badging =="
          "$AAPT2" dump badging "$APK" | head -3
          echo "== debuggable flag (expect no output) =="
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -i debuggable || echo "OK: no debuggable flag"
          echo "== sha256 =="
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          V="${{ steps.version.outputs.version }}"
          cp app/build/outputs/bundle/release/app-release.aab "build-artifacts/OTTER-${V}-release.aab"
          cp app/build/outputs/apk/release/app-universal-release.apk "build-artifacts/Otter-26-better-2.apk"
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk | sed 's/^app-/OTTER-'"${V}"'-/')
            cp "$f" "build-artifacts/${base}.apk"
          done
          ls -l build-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OTTER-${{ steps.version.outputs.version }}-release
          path: build-artifacts/*
          if-no-files-found: error

      - name: Publish official GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          CODE="${{ steps.version.outputs.code }}"
          TAG="v${VERSION}"
          CERT_SHA256=$(keytool -list -keystore "$GITHUB_WORKSPACE/../release.keystore" -storepass otter123 -alias otter | grep -iE "SHA-?256")
          UNIVERSAL_SIZE=$(ls -lh build-artifacts/Otter-26-better-2.apk | awk '{print $5}')
          ARM64_SIZE=$(ls -lh build-artifacts/*arm64-v8a*.apk 2>/dev/null | awk '{print $5}' | head -n1 || echo "N/A")
          {
            echo "## Otter 26-better 2"
            echo
            echo "\`versionName\` ${VERSION}, \`versionCode\` ${CODE}, built from \`${GITHUB_SHA}\`."
            echo
            echo "### APK Size After Reduction"
            echo
            echo "- **Universal APK (all ABIs)**: ~${UNIVERSAL_SIZE} (reduced by over 70MB from the ~220MB previous build by eliminating bundled aria2c binaries and optimizing resources)"
            echo "- **arm64-v8a APK (recommended for modern Android devices)**: ~${ARM64_SIZE}"
            echo
            cat test-summary.md
            echo
            echo "### What changed in this release"
            echo
            echo "- **YouTube Preparing & Quick Download Speed**: Instant start using cached metadata extraction (\`--load-info-json\`) avoiding duplicate yt-dlp calls; removed blocking ping on app warm-up; Quick Download now starts downloads immediately without getting stuck."
            echo "- **Instagram Carousel Video Support**: Instagram carousels now correctly extract and distinguish videos from images. Videos are presented and downloaded as video files, not mistakenly treated as static poster images."
            echo "- **APK Size Trimmed**: Removed unused bundled aria2c native binaries and unneeded package bloat, dramatically slashing APK size down from ~220MB."
            echo "- **Automatic Web Session Cookie Extraction**: Built-in interactive Web Session login and cookie extractor for YouTube, TikTok, Facebook, and Instagram. Automatically captures session cookies and saves Netscape cookie jars directly inside Otter without manual export/import."
            echo "- **Retained All Working Features**: TikTok photo mode, direct media downloads, background service persistence, and clipboard auto-fetch remain fully functional."
            echo
            echo "### Which file to install"
            echo
            echo "The universal build is attached as **\`Otter-26-better-2.apk\`** and runs on every supported ABI. The smaller per-ABI APKs are attached alongside it if you would rather download less (arm64-v8a covers most current phones)."
            echo
            echo "## Files"
            echo
            ls -lh build-artifacts | tail -n +2
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd build-artifacts && sha256sum -- *)
            echo '```'
          } > release-notes.md
          gh release create "$TAG" build-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Otter 26-better 2" \
            --notes-file release-notes.md
          echo "Published $TAG"
