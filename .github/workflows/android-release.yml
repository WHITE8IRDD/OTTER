name: Android Release (official)

# Official sideload release: signed, minified release builds (AAB + APKs).
# Fires on a version tag push or a manual dispatch, never on an ordinary branch push.
# Publishes a NEW tag (v<versionName>) and never deletes anything.

on:
  workflow_dispatch:
  push:
    branches:
      - release/v26.2
    # Pushing a tag is the normal way to cut a release: `git tag v0.2 && git push origin v0.2`.
    # A release can therefore be published from any branch, which is why the work-branch entry the
    # previous release used is gone: it made every push to that branch publish a release.
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The keystore in this repository was created with this password and is committed as a CI
    # secret; `|| 'otter123'` keeps the build working when the secret has not been set, which is
    # what a fork sees. An empty secret would otherwise reach Gradle as an empty password.
    env:
      OTTER_KEYSTORE_PASSWORD: ${{ secrets.OTTER_KEYSTORE_PASSWORD || 'otter123' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}" || { echo "RELEASE_KEYSTORE_BASE64 secret is empty or missing"; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/../release.keystore"
          test -s "$GITHUB_WORKSPACE/../release.keystore" || { echo "keystore restore failed"; exit 1; }
          keytool -list -keystore "$GITHUB_WORKSPACE/../release.keystore" -storepass "$OTTER_KEYSTORE_PASSWORD" -alias otter

      - name: Clean
        run: ./gradlew --no-daemon clean

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Build signed release (APKs + AAB)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease 2>&1 | tee build.log

      - name: Resolve app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          test -n "$VERSION" || { echo "could not read versionName"; exit 1; }
          test -n "$CODE" || { echo "could not read versionCode"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building OTTER $VERSION (versionCode $CODE)"

      - name: Summarise unit tests
        run: |
          python3 - <<'PY' | tee test-summary.md
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for report in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(report).getroot()
              total += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
          print(f"JVM unit tests: {total} run, {failures + errors} failed, {skipped} skipped")
          PY

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/release/ app/build/outputs/bundle/release/
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK="app/build/outputs/apk/release/app-universal-release.apk"
          echo "== signature =="
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer|SHA-256|Verified"
          echo "== badging =="
          "$AAPT2" dump badging "$APK" | head -3
          echo "== debuggable flag (expect no output) =="
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -i debuggable || echo "OK: no debuggable flag"
          echo "== sha256 =="
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          V="${{ steps.version.outputs.version }}"
          UNIVERSAL_ASSET="Otter v2 Tik-You Fix.apk"
          cp app/build/outputs/bundle/release/app-release.aab "build-artifacts/OTTER-${V}-release.aab"
          # The name a user sees in the release list, spelled out once: the universal build is the
          # file the README and the release notes point at.
          cp app/build/outputs/apk/release/app-universal-release.apk "build-artifacts/$UNIVERSAL_ASSET"
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk | sed 's/^app-/OTTER-'"${V}"'-/')
            cp "$f" "build-artifacts/${base}.apk"
          done
          ls -l build-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OTTER-${{ steps.version.outputs.version }}-release
          path: build-artifacts/*
          if-no-files-found: error

      - name: Publish official GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          CODE="${{ steps.version.outputs.code }}"
          TAG="v${VERSION}"
          CERT_SHA256=$(keytool -list -keystore "$GITHUB_WORKSPACE/../release.keystore" -storepass "$OTTER_KEYSTORE_PASSWORD" -alias otter | grep -iE "SHA-?256")
          UNIVERSAL_SIZE=$(ls -lh "build-artifacts/Otter v2 Tik-You Fix.apk" | awk '{print $5}')
          ARM64_SIZE=$(ls -lh build-artifacts/*arm64-v8a*.apk 2>/dev/null | awk '{print $5}' | head -n1 || echo "N/A")
          {
            echo "## Otter v2 Tik-You Fix"
            echo
            echo "\`versionName\` ${VERSION}, \`versionCode\` ${CODE}, built from \`${GITHUB_SHA}\`."
            echo
            echo "This release targets the two platforms that stopped working: TikTok (every link failed)"
            echo "and YouTube (extraction silently lost its ability to solve the site's playback"
            echo "challenge). It also fixes the one reported Instagram regression — Quick Download on a"
            echo "carousel taking you out of Instagram — and changes nothing else in the working Facebook,"
            echo "Instagram carousel, or browser download paths."
            echo
            echo "### YouTube — root cause and fix"
            echo "The engine this app runs is \`yt_dlp\` merged with \`yt_dlp_ejs\`, the JavaScript challenge"
            echo "solver, at build time by the Android wrapper. Plain upstream \`yt-dlp\` ships no such"
            echo "package — it is detected at runtime, not bundled. The previous release's automatic update"
            echo "called the wrapper's own updater, which replaces the engine file with that plain upstream"
            echo "build and silently drops the solver, so YouTube's signature/n-parameter resolution broke"
            echo "on every install whose automatic update ran, while every other extractor kept working."
            echo "- The updater now fetches the solver release matching the engine's own vendored version,"
            echo "  merges the two archives, and verifies the pairing before installing anything."
            echo "- A smoke test runs the merged engine once; a failure rolls back to the previous engine or"
            echo "  re-extracts the APK's own bundled (complete) build."
            echo "- App startup now repairs an already-broken (solver-less) installed engine before first use,"
            echo "  so an install affected by the previous release's bug heals itself."
            echo "- A missing-solver failure is now reported as an engine problem (\"update it in Settings\"),"
            echo "  not a generic or misleading error."
            echo
            echo "### TikTok — root cause and fix"
            echo "TikTok links the app actually receives are short links (\`vm.tiktok.com/…\`, no post id at"
            echo "all) and the forwarded share form (\`tiktok.com/share/video/<id>/\`, no author handle)."
            echo "The pinned extractor's URL matcher accepts neither shape, so every shared TikTok link fell"
            echo "through to the generic page reader and failed. A forced, outdated mobile user-agent on top"
            echo "of that made TikTok answer with its \"open in the app\" page instead of the post."
            echo "- Short links are now resolved (redirect followed, author looked up via TikTok's public"
            echo "  oEmbed endpoint) to the canonical form the extractor matches, for both the fetch and the"
            echo "  download, with the result cached so a later download reuses it."
            echo "- The forced mobile user-agent override was removed; only the Referer header remains, so"
            echo "  the engine's own per-endpoint headers are used."
            echo "- TikTok photo-mode posts are recognised from their forwarded share link too."
            echo
            echo "### Instagram Quick Download"
            echo "Quick Download on a carousel post used to open the main app window, taking you out of"
            echo "Instagram. It now opens a translucent selection window drawn directly over the app you"
            echo "shared from — the same picker, the same download path, no task switch — and closing it"
            echo "returns you to Instagram. A single-video link is unaffected: it still starts the download"
            echo "immediately with no window, as Quick Download always did."
            echo
            echo "### Regression protection"
            echo "No change in this release touches Instagram's carousel extraction, Facebook's download"
            echo "path, the generic/browser page reader, or the shared download manager's file-saving logic."
            echo "JVM unit tests (\`./gradlew :app:testDebugUnitTest\`) run on every build, including new"
            echo "coverage for the TikTok URL rules and the engine/solver pairing rules; none of the existing"
            echo "tests were modified."
            echo
            echo "### Known limitations"
            echo "- This build has not been exercised on a physical device or emulator in this pass; the"
            echo "  engine and solver logic is covered by JVM unit tests and a from-source CI build only."
            echo "- TikTok's oEmbed lookup and short-link redirects depend on TikTok's own endpoints staying"
            echo "  reachable and unchanged; a network or endpoint failure falls back to the link as given."
            echo "- OTTER does not bypass logins, DRM, or anti-automation controls on any site."
            echo
            echo "### APK size"
            echo "- **Universal APK (all ABIs)**: ~${UNIVERSAL_SIZE}"
            echo "- **arm64-v8a APK**: ~${ARM64_SIZE}"
            echo
            cat test-summary.md
            echo
            echo "### Which file to install"
            echo
            echo "The universal build is attached as **\`Otter v2 Tik-You Fix.apk\`** and runs on every"
            echo "supported ABI. The smaller per-ABI APKs are attached alongside it if you would rather"
            echo "download less (arm64-v8a covers most current phones)."
            echo
            echo "## Files"
            echo
            ls -lh build-artifacts | tail -n +2
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd build-artifacts && sha256sum -- *)
            echo '```'
          } > release-notes.md
          gh release create "$TAG" build-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Otter v2 Tik-You Fix" \
            --notes-file release-notes.md
          echo "Published $TAG"
