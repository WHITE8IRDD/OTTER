name: Android validation

on:
  push:
    branches:
      # Any arena/* work branch, so a change is validated before it reaches master
      # instead of only on the branch that happened to add this workflow.
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect candidate APK
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-universal-debug.apk "build-artifacts/Otter 26-better 1.apk"
          sha256sum "build-artifacts/Otter 26-better 1.apk" | tee build-artifacts/SHA256SUMS.txt

      - name: Upload candidate APK
        uses: actions/upload-artifact@v7
        with:
          name: Otter-26-better-1-candidate
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
