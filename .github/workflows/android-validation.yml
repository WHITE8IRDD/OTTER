name: Android validation

on:
  push:
    branches:
      # Any arena/* work branch, so a change is validated before it reaches master
      # instead of only on the branch that happened to add this workflow.
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # The output is teed to a file so that a failure can be summarised below. Runner logs are
      # occasionally unreachable from outside the UI, and a red tick with no readable reason costs a
      # whole round trip to fix; the summary is part of the check run and can be read from the API.
      - name: Run unit tests
        run: |
          mkdir -p build
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build/unit-tests.log

      - name: Build debug APKs
        run: |
          mkdir -p build
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build/assemble.log

      # The excerpt is published as check annotations (and to the step summary) on purpose: runner
      # logs and artifacts are not always reachable from outside the web UI, and a red tick with no
      # readable reason costs a whole round trip to fix.
      - name: Report what broke
        if: failure()
        run: |
          {
            echo '### Validation failed'
            echo
            echo '```'
            grep -hE '^e: |FAILED|expected:|Caused by:|error:|Unresolved reference|Execution failed' \
              build/unit-tests.log build/assemble.log 2>/dev/null | tail -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -hE '^e: |FAILED|expected:|Caused by:|error:|Unresolved reference|Execution failed' \
            build/unit-tests.log build/assemble.log 2>/dev/null | tail -n 40 |
            while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done

      - name: Report test assertion failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/build/test-results').rglob('TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = case.attrib.get('classname', '') + '.' + case.attrib.get('name', '') + ': ' + (failure.text or '')[:4000]
                      print('::error::' + message.replace('%', '%25').replace('\n', '%0A'))
          PY

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs
          path: |
            build/unit-tests.log
            build/assemble.log
            app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect candidate APK
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          ls -la app/build/outputs/apk/debug/
          # Named from the version in the build file, so a candidate can never be labelled with the
          # release that came before it.
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          cp app/build/outputs/apk/debug/app-universal-debug.apk "build-artifacts/OTTER-${V}-universal-debug.apk"
          if [ -f app/build/outputs/apk/debug/app-arm64-v8a-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "build-artifacts/OTTER-${V}-arm64-v8a-debug.apk"
          fi
          sha256sum build-artifacts/* | tee build-artifacts/SHA256SUMS.txt

      - name: Upload candidate APK
        uses: actions/upload-artifact@v7
        with:
          name: OTTER-validation-candidate
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14

  device:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build device tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run transfer, decoding, FFmpeg and media-picker tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.otter.app.engine
      - name: Report device failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              try:
                  root = ET.parse(path).getroot()
                  for case in root.iter('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          message = case.attrib.get('name', '') + ': ' + (failure.text or failure.attrib.get('message', ''))[:6000]
                          print('::error::' + message.replace('%', '%25').replace('\n', '%0A'))
              except ET.ParseError:
                  pass
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-device-verification
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
