name: Android APK

on:
  push:
    branches:
      - arena/23a7b6e2-otter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests and build universal debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log

      - name: Report Gradle failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          log = Path("build.log")
          if log.exists():
              tail = "\n".join(log.read_text(errors="replace").splitlines()[-60:])[:12000]
              encoded = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Gradle failure::{encoded}")
          PY

      - name: Rename universal APK
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-universal-debug.apk "build-artifacts/OTTER 26.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OTTER-26.1
          path: build-artifacts/OTTER 26.1.apk
          if-no-files-found: error
