name: Android APK

on:
  push:
    branches:
      - arena/23a7b6e2-otter
      - arena/b09a8450-otter
      - arena/3dd8a9d3-otter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Diagnostic + live verification of the Instagram carousel pipeline.
  # Runs the same public endpoints the app uses and records what the site
  # actually returned, so a failure is visible instead of silent.
  instagram-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Probe Instagram endpoints from the CI runner
        run: bash .github/scripts/instagram_probe.sh

      - name: Publish probe summary as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/summarise_probe.py > probe-summary.md || echo "summary failed" > probe-summary.md
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          body = pathlib.Path("probe-summary.md").read_text(errors="replace")[:60000]
          subprocess.run(["gh", "api", "-X", "POST",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "--input", "-"], input=json.dumps({"body": body}), text=True, check=True)
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Build arm64-v8a debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Report Gradle failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          lines = []
          for name in ("test.log", "build.log"):
              log = Path(name)
              if not log.exists():
                  continue
              lines.extend(log.read_text(errors="replace").splitlines())
          marker = re.compile(r"(?i)(FAILURE:|what went wrong:|execution failed for task|could not (find|resolve)|no matching variant|^e:|error:|failed to)")
          log_details = []
          for index, line in enumerate(lines):
              if marker.search(line):
                  log_details.extend(lines[max(0, index - 1):min(len(lines), index + 5)])
          test_details = []
          for report in Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
                  for testcase in root.iter("testcase"):
                      for failure in list(testcase.findall("failure")) + list(testcase.findall("error")):
                          test_details.append(f"FAILED {testcase.attrib.get('classname', '')}.{testcase.attrib.get('name', '')}: {failure.attrib.get('message', '')}")
                          if failure.text:
                              text = failure.text
                              keep = [line for line in text.splitlines() if "Caused by" in line or "expected:" in line or "ExceptionInInitializer" in line]
                              test_details.extend((keep + text.splitlines()[:25])[:25])
              except ET.ParseError:
                  pass
          selected = test_details + log_details
          if not selected:
              selected = lines[-20:]
          details = "\n".join(dict.fromkeys(selected))[:6000]
          encoded = details.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle failure::{encoded}")
          Path("ci-failure.txt").write_text(details)
          print(details)
          PY

      - name: Publish failure details as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          path = pathlib.Path("ci-failure.txt")
          body = "CI failure\n\n```\n" + (path.read_text(errors="replace") if path.exists() else "no details collected")[:60000] + "\n```"
          subprocess.run(["gh", "api", "-X", "POST",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "--input", "-"], input=json.dumps({"body": body}), text=True, check=True)
          PY

      - name: Resolve app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          test -n "$VERSION" || { echo "could not read versionName"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building OTTER $VERSION"

      - name: Summarise unit tests
        id: tests
        run: |
          python3 - <<'PY' | tee test-summary.md
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for report in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(report).getroot()
              total += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
          print(f"JVM unit tests: {total} run, {failures + errors} failed, {skipped} skipped")
          PY

      - name: Collect APK artifacts
        run: |
          mkdir -p build-artifacts
          APK="build-artifacts/OTTER-${{ steps.version.outputs.version }}-arm64-v8a-debug.apk"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "$APK"
          ls -l build-artifacts

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: OTTER-${{ steps.version.outputs.version }}-arm64-v8a
          path: build-artifacts/OTTER-${{ steps.version.outputs.version }}-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Publish arm64-v8a debug APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="otter-${VERSION}-arm64-v8a"
          APK="build-artifacts/OTTER-${VERSION}-arm64-v8a-debug.apk"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "Debug-signed test build of OTTER ${VERSION} (arm64-v8a only), built by \`${GITHUB_WORKFLOW}\` from \`${GITHUB_SHA}\`."
            echo
            cat test-summary.md
            echo
            echo "## This build"
            echo
            echo "- **Mixed carousels** - photo and video slides are listed separately in the picker and"
            echo "  both are downloadable: photos through the image path, videos through the video path."
            echo "  The slide counter and the partial-read warning cover both kinds of slide."
            echo "- **History** - a finished download keeps its title, description and hashtags. Tap a"
            echo "  history entry to see them, each with its own copy button. Quick downloads may have"
            echo "  no description or hashtags saved with them."
            echo
            echo "## Instagram"
            echo
            echo "- **Every post type** - single picture, multi-picture, video carousel and mixed,"
            echo "  all without signing in: no cookies are needed and none are sent."
            echo "- **Failure says why** - a post that cannot be read reports what each endpoint"
            echo "  returned instead of leaving the screen sitting on an empty picker."
            echo
            echo "## Install"
            echo
            echo "- arm64-v8a only. Debug-signed with the public Android debug key committed at"
            echo "  \`.github/debug.keystore\`, so a newer test build installs over the previous one."
            echo "- Uninstall an older OTTER build first if Android refuses to install over it."
            echo
            echo "## APK sha256"
            echo
            echo '```'
            echo "${SHA256}"
            echo '```'
          } > release-notes.md
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "OTTER ${VERSION} - arm64-v8a debug" \
            --notes-file release-notes.md
          echo "Published $TAG"
