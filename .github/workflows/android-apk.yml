name: Android APK

on:
  push:
    branches:
      - arena/23a7b6e2-otter
      - arena/b09a8450-otter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Diagnostic probe: what does Instagram actually return to a CI runner?
  # Useful when the live verification below cannot read the post.
  instagram-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Probe Instagram endpoints
        run: |
          bash .github/scripts/instagram_probe.sh > probe_console.txt 2>&1 || true
          tail -40 probe_console.txt

      - name: Summarise probe output
        if: always()
        run: |
          python3 .github/scripts/summarise_probe.py > probe-summary.md || echo "summary step failed" > probe-summary.md
          {
            echo ""
            echo "--- probe console ---"
            echo '```'
            tail -30 probe_console.txt 2>/dev/null || echo "(no console output)"
            echo '```'
          } >> probe-summary.md

      - name: Publish probe summary as a commit comment
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          body = pathlib.Path("probe-summary.md").read_text(errors="replace")[:60000]
          subprocess.run(["gh", "api", "-X", "POST",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "--input", "-"], input=json.dumps({"body": body}), text=True, check=True)
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk_kind: ${{ steps.collect.outputs.apk_kind }}
    # The secrets context cannot be used in a step `if:`, so the optional signing
    # flag is exposed through job-level env instead.
    env:
      KEYSTORE_BASE64: ${{ secrets.OTTER_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # A fresh runner would otherwise generate a brand new debug key on every run,
      # and a test APK signed by a different key cannot be installed over the
      # previous one. This is the public Android debug key, not a release secret.
      - name: Use the repository debug key for test builds
        run: |
          mkdir -p "$HOME/.android"
          cp .github/debug.keystore "$HOME/.android/debug.keystore"

      # Optional: only runs when the repository defines these secrets.
      - name: Configure release signing (optional)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.OTTER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OTTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OTTER_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "SIGNED_BUILD=yes" >> "$GITHUB_ENV"

      - name: Unit tests and live Instagram verification
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest -PotterLive=true 2>&1 | tee test.log

      - name: Publish test verdict as a commit comment
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/live_verdict.py > live-verdict.md || echo "verdict script failed" > live-verdict.md
          cat live-verdict.md
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          body = pathlib.Path("live-verdict.md").read_text(errors="replace")[:60000]
          subprocess.run(["gh", "api", "-X", "POST",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "--input", "-"], input=json.dumps({"body": body}), text=True, check=True)
          PY

      - name: Report Gradle failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          lines = []
          for name in ("test.log", "build.log"):
              log = Path(name)
              if log.exists():
                  lines.extend(log.read_text(errors="replace").splitlines())
          marker = re.compile(r"(?i)(FAILURE:|what went wrong:|execution failed for task|could not (find|resolve)|no matching variant|^e:|error:|failed to)")
          log_details = []
          for index, line in enumerate(lines):
              if marker.search(line):
                  log_details.extend(lines[max(0, index - 1):min(len(lines), index + 5)])
          test_details = []
          for report in Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
                  for testcase in root.iter("testcase"):
                      for failure in list(testcase.findall("failure")) + list(testcase.findall("error")):
                          test_details.append(f"FAILED {testcase.attrib.get('classname', '')}.{testcase.attrib.get('name', '')}: {failure.attrib.get('message', '')}")
                          if failure.text:
                              keep = [line for line in failure.text.splitlines() if "Caused by" in line or "expected:" in line]
                              test_details.extend((keep + failure.text.splitlines()[:25])[:25])
              except ET.ParseError:
                  pass
          selected = test_details + log_details
          if not selected:
              selected = lines[-20:]
          details = "\n".join(dict.fromkeys(selected))[:6000]
          print(details)
          Path("ci-failure.txt").write_text(details)
          PY

      - name: Publish failure details as a commit comment
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          path = pathlib.Path("ci-failure.txt")
          body = "CI failure\n\n```\n" + (path.read_text(errors="replace") if path.exists() else "no details collected")[:60000] + "\n```"
          subprocess.run(["gh", "api", "-X", "POST",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "--input", "-"], input=json.dumps({"body": body}), text=True, check=True)
          PY

      - name: Build arm64-v8a debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Build signed arm64-v8a release APK (only when signing is configured)
        if: ${{ env.SIGNED_BUILD == 'yes' }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee -a build.log

      - name: Collect APK
        id: collect
        run: |
          mkdir -p build-artifacts
          if [ "${SIGNED_BUILD:-no}" = "yes" ] && [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk build-artifacts/OTTER-26.1-arm64-v8a-release.apk
            echo "apk_kind=release" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk build-artifacts/OTTER-26.1-arm64-v8a-debug.apk
            echo "apk_kind=debug" >> "$GITHUB_OUTPUT"
          fi
          # Ship the live verification verdict with the APK so the release notes can
          # quote the run that actually proved the downloads.
          cp -f live-verdict.md build-artifacts/ 2>/dev/null || true
          ls -l build-artifacts

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: OTTER-26.1-arm64-v8a
          path: build-artifacts/*
          if-no-files-found: error

  # Publishes the APK built above. Runs on demand (workflow_dispatch), or on a push
  # whose commit message asks for it, so pushes do not create a release for every
  # commit and CI tokens without the actions:write scope can still publish.
  release:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download APK built by this run
        uses: actions/download-artifact@v7
        with:
          name: OTTER-26.1-arm64-v8a
          path: build-artifacts

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="otter-26.1-arm64-v8a"
          APK=$(ls build-artifacts/*.apk | head -1)
          KIND="${{ needs.build.outputs.apk_kind }}"
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          APKSIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          CERT=""
          if [ -n "$APKSIGNER" ]; then
            CERT=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -i "SHA-256 digest" | head -1 | sed 's/^[[:space:]]*//' || true)
          fi
          if [ -s build-artifacts/live-verdict.md ]; then
            cp build-artifacts/live-verdict.md live-verdict.md
          else
            python3 .github/scripts/live_verdict.py > live-verdict.md 2>/dev/null || true
          fi

          {
            echo "OTTER 26.1 — arm64-v8a build for phone testing."
            echo ""
            echo "APK: \`$(basename "$APK")\` (ABI: arm64-v8a, variant: $KIND)"
            echo ""
            echo "### Instagram carousel fixes"
            echo "- Carousel slides are read in payload order from the page, the public"
            echo "  web API, the embed page and the legacy JSON endpoints, and the results"
            echo "  are merged, so a partial read no longer shows up as \"1/1 selected\"."
            echo "- Signed CDN query strings are preserved (and HTML/JS escapes decoded):"
            echo "  dropping them made Instagram answer 403, which is why previews were"
            echo "  blank and \`Download Selected\` saved nothing."
            echo "- Picker thumbnails are loaded with a browser user agent and an"
            echo "  instagram.com referer."
            echo "- Downloads fall back to the app folder when \"All files access\" is"
            echo "  missing instead of silently failing."
            echo ""
            echo "### Build fingerprint"
            echo ""
            echo "apk sha256: $APK_SHA"
            if [ -n "$CERT" ]; then
              echo ""
              echo "signing certificate: $CERT"
            fi
            echo ""
            echo "### Release signing"
            if [ "$KIND" = "release" ]; then
              echo "This APK is signed with the repository's release keystore."
            else
              echo "No release keystore is configured for this repository, so this is a"
              echo "**debug-signed** APK for testing (stable Android debug key, so newer"
              echo "test builds install over older ones). It is not suitable for store"
              echo "distribution."
              echo ""
              echo "Want a properly release-signed APK? Add the OTTER_KEYSTORE_BASE64,"
              echo "OTTER_KEYSTORE_PASSWORD, OTTER_KEY_ALIAS and OTTER_KEY_PASSWORD"
              echo "repository secrets and this workflow switches to the release variant"
              echo "automatically."
            fi
            echo ""
            if [ -s live-verdict.md ]; then
              echo "### Live verification (this workflow run)"
              echo ""
              cat live-verdict.md
            fi
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "OTTER 26.1 (arm64-v8a)" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "$APK" --title "OTTER 26.1 (arm64-v8a)" --notes-file release-notes.md --latest
          fi
          gh release view "$TAG" --json url -q .url
