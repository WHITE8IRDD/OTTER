name: Android APK

on:
  push:
    branches:
      - arena/23a7b6e2-otter
      - arena/b09a8450-otter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Diagnostic + live verification of the Instagram carousel pipeline.
  # Runs the same public endpoints the app uses and records what the site
  # actually returned, so a failure is visible instead of silent.
  instagram-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Probe Instagram endpoints from the CI runner
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36'
          POST='https://www.instagram.com/p/DeEo7SjjLYz/'
          URL='https://www.instagram.com/p/DeEo7SjjLYz/?img_index=2&mdxt=MTB3NWI3aGFiYWg3eQ=='
          MEDIA_ID=4000502365245191731

          probe () {
            local label="$1"; shift
            local out="probe_${label}.txt"
            local code
            code=$(curl -sS -L --max-time 45 -A "$UA" \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              -o "$out" -w '%{http_code} %{size_download} %{content_type}' "$@" 2>&1 | tail -1)
            echo "=== $label -> $code"
            echo "--- first 240 chars:"
            head -c 240 "$out" | tr -d '\r'
            echo
            echo "--- markers:"
            for m in 'xdt_api__v1__media__shortcode__web_info' 'edge_sidecar_to_children' 'carousel_media' 'image_versions2' 'display_url' 'og:image'; do
              printf '  %-42s %s\n' "$m" "$(grep -o "$m" "$out" | wc -l)"
            done
            echo "  scontent occurrences:     $(grep -o 'scontent' "$out" | wc -l)"
            echo "  cdninstagram occurrences: $(grep -o 'cdninstagram' "$out" | wc -l)"
            echo
          }

          probe page            "$POST"
          probe page_query      "$URL"
          probe a1              "${POST}?__a=1&__d=dis"
          probe embed           "https://www.instagram.com/p/DeEo7SjjLYz/embed/captioned/"
          probe webapi          "https://www.instagram.com/api/v1/media/${MEDIA_ID}/info/" -H 'X-IG-App-ID: 936619743392459'
          probe iapi            "https://i.instagram.com/api/v1/media/${MEDIA_ID}/info/" -H 'X-IG-App-ID: 936619743392459'
          echo "probe finished"

      - name: Publish probe output as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, pathlib
          parts = []
          for f in sorted(pathlib.Path('.').glob('probe_*.txt')):
              parts.append(f"### {f.name} ({f.stat().st_size} bytes)\n" + f.read_text(errors='replace')[:2500])
          body = "Instagram probe from CI\n\n" + "\n\n".join(parts) if parts else "Instagram probe produced no dumps"
          body = body[:60000]
          payload = json.dumps({"body": body})
          subprocess.run(["gh", "api", "-X", "POST",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "--input", "-"], input=payload, text=True, check=True)
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Build arm64-v8a debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Report Gradle failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          lines = []
          for name in ("test.log", "build.log"):
              log = Path(name)
              if not log.exists():
                  continue
              lines.extend(log.read_text(errors="replace").splitlines())
          marker = re.compile(r"(?i)(FAILURE:|what went wrong:|execution failed for task|could not (find|resolve)|no matching variant|^e:|error:|failed to)")
          log_details = []
          for index, line in enumerate(lines):
              if marker.search(line):
                  log_details.extend(lines[max(0, index - 1):min(len(lines), index + 5)])
          test_details = []
          for report in Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
                  for testcase in root.iter("testcase"):
                      for failure in list(testcase.findall("failure")) + list(testcase.findall("error")):
                          test_details.append(f"FAILED {testcase.attrib.get('classname', '')}.{testcase.attrib.get('name', '')}: {failure.attrib.get('message', '')}")
                          if failure.text:
                              test_details.extend(failure.text.splitlines()[:12])
              except ET.ParseError:
                  pass
          selected = test_details + log_details
          if not selected:
              selected = lines[-20:]
          details = "\n".join(dict.fromkeys(selected))[:3000]
          encoded = details.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle failure::{encoded}")
          Path("ci-failure.txt").write_text(details)
          print(details)
          PY

      - name: Publish failure details as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          path = pathlib.Path("ci-failure.txt")
          body = "CI failure\n\n```\n" + (path.read_text(errors="replace") if path.exists() else "no details collected")[:60000] + "\n```"
          subprocess.run(["gh", "api", "-X", "POST",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "--input", "-"], input=json.dumps({"body": body}), text=True, check=True)
          PY

      - name: Collect APK artifacts
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "build-artifacts/OTTER-26.1-arm64-v8a-debug.apk"
          ls -l build-artifacts

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: OTTER-26.1-arm64-v8a
          path: build-artifacts/OTTER-26.1-arm64-v8a-debug.apk
          if-no-files-found: error
